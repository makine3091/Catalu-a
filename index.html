<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversor de Unidades de Cocina | Medidas al punto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <p class="eyebrow">Cocina &amp; medidas</p>
    <h1>Conversor de Unidades<br><span>de Cocina</span></h1>
    <p class="subtitle">Tazas, cucharadas, gramos, onzas y grados de horno — convertidos al vuelo, como una báscula digital.</p>
  </header>

  <main>
    <section class="converter-card" aria-label="Conversor">

      <div class="tabs" role="tablist" aria-label="Categoría de medida">
        <button class="tab active" data-category="volumen" role="tab" aria-selected="true">Volumen</button>
        <button class="tab" data-category="peso" role="tab" aria-selected="false">Peso</button>
        <button class="tab" data-category="temperatura" role="tab" aria-selected="false">Horno</button>
      </div>

      <div class="converter-body">

        <div class="field">
          <label for="input-value">Cantidad</label>
          <input type="number" id="input-value" value="1" step="any" inputmode="decimal">
        </div>

        <div class="unit-row">
          <div class="field">
            <label for="from-unit">De</label>
            <select id="from-unit"></select>
          </div>

          <button id="swap-btn" class="swap-btn" aria-label="Intercambiar unidades" title="Intercambiar">⇄</button>

          <div class="field">
            <label for="to-unit">A</label>
            <select id="to-unit"></select>
          </div>
        </div>

        <div class="readout" aria-live="polite">
          <span id="readout-value">240.00</span>
          <span id="readout-unit" class="readout-unit">ml</span>
        </div>

      </div>
    </section>

    <section class="cheatsheet" aria-label="Tabla de referencia rápida">
      <h2>Chuleta de cocina</h2>
      <div id="cheatsheet-table" class="cheatsheet-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Hecho para no volver a arruinar una receta por una conversión. · <span id="year"></span></p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
